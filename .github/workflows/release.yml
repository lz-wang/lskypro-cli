name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: ''
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            suffix: ''
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: ''
            archive: tar.gz
          - goos: windows
            goarch: amd64
            suffix: '.exe'
            archive: zip
          - goos: windows
            goarch: arm64
            suffix: '.exe'
            archive: zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Get short commit hash
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.commit.outputs.short }}"
          go build -ldflags "-s -w -X main.version=$VERSION" -o lc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .

      - name: Package WebDAV archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.commit.outputs.short }}"
          name="lc_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          package_dir="release/${name}"
          mkdir -p "${package_dir}"
          cp "lc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" "${package_dir}/lc${{ matrix.suffix }}"
          if [[ "${{ matrix.archive }}" == 'zip' ]]; then
            archive="release/${name}.zip"
            (cd "${package_dir}" && zip -qr "${GITHUB_WORKSPACE}/${archive}" .)
          else
            archive="release/${name}.tar.gz"
            tar -C "${package_dir}" -czf "${archive}" .
          fi
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Upload archive and checksum to WebDAV
        continue-on-error: true
        uses: bxb100/action-upload-webdav@v1
        with:
          webdav_address: ${{ secrets.WEBDAV_SERVER }}
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/Shares/github/${{ github.repository }}/${{ steps.commit.outputs.short }}"
          files: |
            release/lc_${{ steps.commit.outputs.short }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
            release/lc_${{ steps.commit.outputs.short }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version info
        id: version
        run: |
          DATE=$(date +%Y-%m-%d)
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          echo "release_name=${DATE}-${SHORT_COMMIT}" >> $GITHUB_OUTPUT
          echo "tag_name=v${DATE}-${SHORT_COMMIT}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: lc-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.release_name }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
